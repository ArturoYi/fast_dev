name: fast_dev
description: "只放在 dev_dependencies 的 Flutter 开发期工具：资源代码生成，后续还将覆盖字体、颜色与 import 整理。"
version: 0.0.1

environment:
  sdk: ^3.12.2

# `dart pub global activate` 或 `dart run fast_dev` 时使用的可执行入口。
executables:
  fast_dev: fast_dev

dependencies:
  args: ^2.7.0
  # 3.1.9+ 需要 analyzer 13 / meta ^1.18.3，和当前 Flutter SDK 钉死的 meta 1.18.0
  # 冲突，example 这个 Flutter 应用就解析不了 path 依赖。
  dart_style: ">=3.1.0 <3.1.9"
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
