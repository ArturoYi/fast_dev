name: 功能
description: 新能力、CLI、文档
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说一下要解决什么，以及期望长什么样。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么
      description: 为什么是开发期的事，而不是 Fast Package 该收的。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望长什么样
      description: 命令、配置键、或生成结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么做
      description: 可选。
