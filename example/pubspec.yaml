name: fast_dev_example
description: "用来手工试用 fast_dev 的最小 Flutter 应用。"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.4.0
  fast_dev:
    path: ../
  fast_dev_runner:
    path: ../fast_dev_runner
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
